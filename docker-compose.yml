services:
  backend:
    build: ./backend
    container_name: rag-backend
    environment:
      # 必填：缺失时后端启动校验会拒绝（compose 会直接报错提示）
      - SECRET_KEY=${SECRET_KEY:?请在项目根目录 .env 中设置 SECRET_KEY}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-fastembed}
      - EMBEDDING_CACHE_DIR=/app/db_data/models
      # 模型下载走国内镜像（首次启动下载约 90MB）
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HUB_DISABLE_XET=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      # SQLite / 向量索引 / 上传文件 / 日志 全部落在这里，删除容器不丢数据
      - ./docker-data:/app/db_data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: rag-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
