name: backend-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 只注入启动所需的占位值，故意不设 EMBEDDING_PROVIDER：
      # 各用例用 monkeypatch 自行声明 provider，外部注入会让默认值断言漂移。
      # fastembed 全程不加载真实模型（用例内替换了 langchain 的类）。
      - name: Run pytest
        env:
          SECRET_KEY: ci-dummy-secret
          LLM_API_KEY: ci-dummy-key
        run: python -m pytest -v
